<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="16 by 12 shed floor plan: centered door with a jalousie on each side">
  <rect width="960" height="620" fill="#f7f5f0"/>
  <text x="480" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1f1f1f">16 x 12 foundation - first measurements</text>
  <text x="480" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#555">Door centered on the 16 ft eave. One 18 x 22 in jalousie each side, midway to the corner.</text>

  <!-- 16 ft = 560 px, 12 ft = 420 px at 35 px/ft. Origin 200,90 -->
  <rect x="200" y="90" width="560" height="420" fill="#fff" stroke="#1b1612" stroke-width="3"/>

  <text x="480" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2f6b3a">16 ft - back eave (2 soffit vents, no gutter)</text>
  <text x="480" y="528" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2f6b3a">16 ft - door side (gutter + nest)</text>
  <text x="188" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2f6b3a" transform="rotate(-90 188 300)">12 ft gable</text>
  <text x="788" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2f6b3a" transform="rotate(-90 788 300)">12 ft gable</text>

  <!-- door 4 ft = 140 px, centered: x = 200 + (560-140)/2 = 410 -->
  <rect x="410" y="500" width="140" height="18" fill="#f3ead4" stroke="#8a2b12" stroke-width="2"/>
  <text x="480" y="514" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8a2b12">door 48 x 75.5 in</text>

  <!-- each side bay is 6 ft = 210 px; window 18 in = 52.5 px, centered in bay -->
  <!-- left bay 200-410, window x = 200 + (210-52.5)/2 = 278.75 -->
  <rect x="278.75" y="502" width="52.5" height="14" fill="#d7eefc" stroke="#1d4e89" stroke-width="2"/>
  <text x="305" y="494" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1d4e89">18 x 22 in</text>
  <!-- right bay 550-760, window x = 550 + (210-52.5)/2 = 628.75 -->
  <rect x="628.75" y="502" width="52.5" height="14" fill="#d7eefc" stroke="#1d4e89" stroke-width="2"/>
  <text x="655" y="494" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1d4e89">18 x 22 in</text>

  <text x="480" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1b1612">12 x 16 ft</text>
  <text x="480" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5c5146">about 192 sq ft footprint</text>
  <text x="480" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c5146">2x4 studs 74 in / 2x6 sill 1.5 in / double top plate 3 in / block 8.5 in</text>
  <text x="480" y="344" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c5146">87 in top of wall to bottom of block. Studs run to the sheathing (open framed).</text>
  <text x="480" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Ridge runs the 16 ft way. Two jalousies = intake. Exhaust still high on the back or a gable.</text>

  <text x="480" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#555">Cloth run about 56 ft of perimeter (2x16 + 2x12). One 24 in x 25 ft roll of 1/4 in cloth, cut into 8 in strips, is enough.</text>
  <text x="480" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#555">Door stays: two ~24 in leaves in a 48 in opening. Repair bottoms, do not replace the frame.</text>
  <text x="480" y="600" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#555">Still need: roof face / pitch, wall-to-block gap, sill treated?, Y (sill run lengths).</text>
</svg>
